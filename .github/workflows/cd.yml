# GitHub Actions CD 工作流程文件
# 触发条件：push 到 main 或 develop 分支时自动执行，也可手动触发
name: CD

on:
  # 当 push 到 main、develop 或 master 分支时触发
  push:
    branches: [main, master, develop]
  # 允许手动触发部署（通过 GitHub Actions 页面操作）
  workflow_dispatch:
    # 手动触发时可选择分支
    inputs:
      branch:
        description: '要部署的分支'
        required: true
        default: 'master'
        type: choice
        options:
          - main
          - master
          - develop

# 设置环境变量
env:
  # 设置 Node.js 环境为生产环境
  NODE_ENV: production

jobs:
  # 部署任务
  deploy:
    # 指定运行在最新的 Ubuntu 系统上
    runs-on: ubuntu-latest
    # 部署环境配置
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    # 设置 GitHub Pages 所需的权限
    permissions:
      # 需要写入权限来部署到 GitHub Pages
      pages: write
      # 需要读取仓库内容的权限
      contents: read
      # 需要 ID token 来进行身份验证
      id-token: write

    # 步骤
    steps:
      # 1. 检出代码 - 拉取当前仓库的代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 只检出最新提交，不保留完整历史（适用于部署）
          fetch-depth: 0

      # 2. 设置 Node.js 环境 - 使用 .nvmrc 文件指定的版本
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 从项目根目录的 .nvmrc 文件读取 Node.js 版本
          node-version-file: '.nvmrc'

      # 3. 安装 pnpm 包管理器
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # 4. 获取 pnpm store 目录并设置缓存
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      # 5. 设置 pnpm 缓存以加快后续安装速度
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 6. 安装项目依赖 - 使用 --frozen-lockfile 确保依赖版本锁定
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 7. 构建所有应用（前后端都构建）
      # 注意：web-client 使用 nuxt generate 生成静态文件，以便部署到 GitHub Pages
      - name: Build applications
        run: |
          pnpm build:packages
          pnpm --filter @ai-qa-apps/web-client generate

      # 8. 验证构建产物
      # 注意：只验证 web-client，因为 api-server 不需要部署到 GitHub Pages
      - name: Verify build output
        run: |
          echo "检查 Web Client 静态构建产物..."
          if [ -d "apps/web-client/dist" ]; then
            echo "✅ Web Client 构建成功"
            ls -la apps/web-client/dist/
          else
            echo "❌ Web Client 构建失败"
            exit 1
          fi

      # 9. 配置 GitHub Pages - 设置部署目标
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 10. 验证 Web Client 输出目录结构
      - name: Validate the Nuxt output exists
        run: |
          if [ -d "apps/web-client/dist" ]; then
            echo "✅ Nuxt 静态输出目录存在"
            ls -la apps/web-client/dist/
          else
            echo "⚠️  Nuxt 静态输出目录不存在，尝试检查其他位置..."
            ls -la apps/web-client/
          fi

      # 11. 上传构建产物作为 GitHub Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 上传 Web Client 的 Nuxt 静态输出目录
          path: 'apps/web-client/dist'
          # artifact 的名称，用于后续部署步骤引用
          name: github-pages

      # 12. 部署到 GitHub Pages
      # 注意：如果 GitHub Pages 超时，可以注释掉这个步骤，artifact 仍然会上传
      # 你可以在 Actions 页面手动完成部署
      - name: Deploy to GitHub Pages
        if: success() # 仅在构建成功时部署
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
          timeout: 15
